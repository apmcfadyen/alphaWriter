<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: #1E1E28;
    color: #E8E4DC;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 16px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  #editor {
    flex: 1;
    padding: 24px 48px;
    outline: none;
    overflow-y: auto;
    line-height: 1.8;
    caret-color: #A89EC9;
    word-spacing: 0.05em;
  }

  ::selection {
    background-color: #3D3D55;
    color: #E8E4DC;
  }

  #editor p { margin-bottom: 0.6em; }
  #editor p:first-child { margin-top: 0; }

  #editor:empty::before {
    content: attr(data-placeholder);
    color: #5A5A6A;
    pointer-events: none;
    display: block;
  }

  #editor::-webkit-scrollbar { width: 6px; }
  #editor::-webkit-scrollbar-track { background: #1E1E28; }
  #editor::-webkit-scrollbar-thumb { background: #3A3A48; border-radius: 3px; }

  .comment {
    color: #5A5A6A;
    font-style: italic;
  }

  /* Entity highlights — display only, stripped before save */
  .entity            { color: #A89EC9; text-decoration: underline; cursor: pointer; }
  .entity-location   { color: #7EC8A4; }
  .entity-item       { color: #C8B07A; }

  /* Editorial annotations — painted with the CSS Custom Highlight API, so they
     never touch the DOM, the caret, or the saved HTML. */
  ::highlight(aw-copy) { background-color: rgba(97,175,239,0.10);  text-decoration: underline wavy rgba(97,175,239,0.85);  text-underline-offset: 4px; }
  ::highlight(aw-line) { background-color: rgba(229,192,123,0.10); text-decoration: underline wavy rgba(229,192,123,0.85); text-underline-offset: 4px; }
  ::highlight(aw-dev)  { background-color: rgba(198,120,221,0.08); text-decoration: underline dotted rgba(198,120,221,0.80); text-underline-offset: 4px; }
  ::highlight(aw-focus){ background-color: rgba(168,158,201,0.38); }

  #aw-pop {
    position: fixed; z-index: 10; display: none;
    max-width: 380px; min-width: 240px;
    background: #2A2A38; color: #E8E4DC;
    border: 1px solid #3F3F52; border-radius: 6px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.45);
    font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; line-height: 1.45;
    padding: 10px 12px;
  }
  #aw-pop.open { display: block; }
  #aw-pop .aw-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  #aw-pop .aw-dot { width: 8px; height: 8px; border-radius: 4px; flex: none; }
  #aw-pop .aw-title { font-weight: 600; font-size: 12px; color: #C9C4D8; }
  #aw-pop .aw-msg { color: #D8D4CC; margin-bottom: 8px; }
  #aw-pop .aw-sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  #aw-pop .aw-sugg button { background: #3A5A40; color: #E8F5E9; border-color: #4E7A56; }
  #aw-pop .aw-actions { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid #3A3A4C; padding-top: 8px; }
  #aw-pop button {
    font: inherit; font-size: 12px; cursor: pointer;
    background: #34344A; color: #D8D4E8; border: 1px solid #45455C; border-radius: 4px; padding: 3px 8px;
  }
  #aw-pop button:hover { background: #40405A; }
</style>
</head>
<body>
  <div id="editor"
       contenteditable="true"
       spellcheck="true"
       data-placeholder="Start writing...">
  </div>
  <div id="aw-pop" role="dialog" aria-live="polite"></div>

<script>
  var _ready = false;
  var _notifyTimer = null;
  var _highlightTimer = null;

  // Raw content cache — captured before any DOM modification.
  // getContent() returns this so C# always gets a stable value.
  var _rawContent = '';
  var _wordCount = 0;

  // Entity manifest pushed from C# via setEntities().
  // Each entry: { id, type, terms: [...sorted longest-first] }
  var _entities = [];

  // ── Argument decoding ───────────────────────────────────────────────────────
  // C# passes data as base64 (see WriterPage.JsArg). MAUI's Windows WebView wraps every
  // script in eval('...'), which decodes escape sequences twice: a JSON """ becomes
  // a raw quote and breaks the call. Base64 has no quotes or backslashes to mangle.

  function decodeArg(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  // ── Content API ─────────────────────────────────────────────────────────────

  function setContent(rawHtml) {
    clearTimeout(_notifyTimer);
    clearTimeout(_highlightTimer);
    _rawContent = rawHtml || '';
    _wordCount = computeWordCount(_rawContent);
    var highlighted = applyCommentHighlighting(_rawContent);
    highlighted = applyEntityHighlighting(highlighted);
    document.getElementById('editor').innerHTML = highlighted;
    _ready = true;
    hidePopover();
    renderAnnotations();
  }

  // Immediately captures the current editor DOM content into _rawContent,
  // cancels pending timers, and updates _wordCount. Called by C# before
  // switching scenes so that the outgoing scene's content is not lost.
  function flushContent() {
    clearTimeout(_notifyTimer);
    clearTimeout(_highlightTimer);
    _rawContent = stripAllVisualSpans(document.getElementById('editor').innerHTML);
    _wordCount = computeWordCount(_rawContent);
  }

  function getContent() {
    return _rawContent;
  }

  function computeWordCount(rawHtml) {
    var text = rawHtml;
    // Block-level tags → newline so // comments terminate at line breaks
    text = text.replace(/<br\s*\/?>/gi, '\n');
    text = text.replace(/<\/?(div|p|li|tr|h[1-6]|ul|ol|blockquote)[^>]*>/gi, '\n');
    // Strip remaining tags
    text = text.replace(/<[^>]*>/g, '');
    // Decode common entities
    text = text.replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&')
               .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>').replace(/&quot;/gi, '"');
    // Strip block then line comments
    text = text.replace(/\/\*[\s\S]*?\*\//g, '');
    text = text.replace(/\/\/[^\n]*/g, '');
    return text.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
  }

  function getWordCount() {
    return _wordCount;
  }

  // Atomic flush-and-return: combines flushContent + getContent + getWordCount
  // into a single call so C# needs only one EvaluateJavaScriptAsync round-trip.
  function flushAndGet() {
    flushContent();
    return JSON.stringify({ content: _rawContent, wordCount: _wordCount });
  }

  // ── Visual span stripping ────────────────────────────────────────────────────
  // Removes ALL display-only spans (comments + entities) to recover clean raw HTML.

  function stripAllVisualSpans(html) {
    // Strip inner (entity) spans first so outer (comment) spans have no nested </span>
    html = html.replace(/<span class="entity[^"]*"[^>]*>([\s\S]*?)<\/span>/gi, '$1');
    html = html.replace(/<span class="comment">([\s\S]*?)<\/span>/gi, '$1');
    return html;
  }

  // ── Comment highlighting ─────────────────────────────────────────────────────
  // Walks the HTML string, passing tags through unchanged.
  // Wraps // and /* */ patterns in <span class="comment">.
  // Block-level elements (div, p, br) terminate line comments.
  // Block comments persist through all elements (span is re-opened after each tag).

  function applyCommentHighlighting(html) {
    var result = '';
    var i = 0;
    var inLine = false;
    var inBlock = false;

    function openSpan()  { result += '<span class="comment">'; }
    function closeSpan() { result += '</span>'; inLine = false; inBlock = false; }

    while (i < html.length) {

      // ── HTML tag ─────────────────────────────────────────────────────────────
      if (html[i] === '<') {
        var end = html.indexOf('>', i);
        if (end === -1) { result += html.slice(i); break; }
        var tag = html.slice(i, end + 1);
        var isBlock = /^<(br|div|\/div|p|\/p|li|\/li)/i.test(tag);

        var wasBlock = inBlock;
        var wasLine  = inLine;

        // Close any active span before the tag (required for valid HTML)
        if (wasBlock || wasLine) closeSpan();
        result += tag;

        // Reopen block comment after every tag (it continues through all markup)
        if (wasBlock) { openSpan(); inBlock = true; }
        // Line comment: continue through inline tags, terminate at block elements
        else if (wasLine && !isBlock) { openSpan(); inLine = true; }
        // wasLine && isBlock → line comment terminated, do not reopen

        i = end + 1;
        continue;
      }

      // ── HTML entity — pass through intact ────────────────────────────────────
      if (html[i] === '&') {
        var semi = html.indexOf(';', i);
        if (semi !== -1 && semi - i <= 8) {
          result += html.slice(i, semi + 1);
          i = semi + 1;
          continue;
        }
      }

      // ── Block comment end: */ ─────────────────────────────────────────────────
      if (inBlock && i + 1 < html.length && html[i] === '*' && html[i + 1] === '/') {
        result += '*/';
        closeSpan();
        i += 2;
        continue;
      }

      // ── Block comment start: /* ───────────────────────────────────────────────
      if (!inLine && !inBlock && i + 1 < html.length && html[i] === '/' && html[i + 1] === '*') {
        openSpan(); inBlock = true;
        result += '/*';
        i += 2;
        continue;
      }

      // ── Line comment start: // ────────────────────────────────────────────────
      if (!inLine && !inBlock && i + 1 < html.length && html[i] === '/' && html[i + 1] === '/') {
        openSpan(); inLine = true;
        result += '//';
        i += 2;
        continue;
      }

      // ── Newline — terminates line comment ─────────────────────────────────────
      if (inLine && html[i] === '\n') {
        closeSpan();
        result += '\n';
        i++;
        continue;
      }

      result += html[i];
      i++;
    }

    if (inLine || inBlock) closeSpan();
    return result;
  }

  // ── Entity highlighting ──────────────────────────────────────────────────────
  // Walks text segments between HTML tags, matches entity names/aliases,
  // wraps matches in entity spans. Never touches tag attributes or existing spans.

  function setEntities(arr) {
    try {
      _entities = (arr || []).map(function(e) {
        var terms = [e.name].concat(e.aliases || [])
          .filter(function(t) { return t && t.trim().length > 0; });
        // Sort longest-first so "John Smith" is matched before "John"
        terms.sort(function(a, b) { return b.length - a.length; });
        return { id: e.id, type: e.type, terms: terms };
      }).filter(function(e) { return e.terms.length > 0; });
    } catch(err) {
      _entities = [];
    }
    // Refresh highlighting if a scene is already loaded. Wrapped in try-catch
    // so a DOM/caret error during refresh never kills the setEntities call and
    // never prevents _entities from being visible to subsequent setContent calls.
    if (_ready) {
      try { refreshHighlighting(); } catch(e) {}
    }
    return _entities.length;
  }

  function applyEntityHighlighting(html) {
    if (_entities.length === 0) return html;
    var result = '';
    var i = 0;
    while (i < html.length) {
      // Pass HTML tags through unchanged
      if (html[i] === '<') {
        var end = html.indexOf('>', i);
        if (end === -1) { result += html.slice(i); break; }
        result += html.slice(i, end + 1);
        i = end + 1;
        continue;
      }
      // Pass HTML entities through intact
      if (html[i] === '&') {
        var semi = html.indexOf(';', i);
        if (semi !== -1 && semi - i <= 8) {
          result += html.slice(i, semi + 1);
          i = semi + 1;
          continue;
        }
      }
      // Collect a plain-text segment up to the next tag
      var segEnd = html.indexOf('<', i);
      if (segEnd === -1) segEnd = html.length;
      result += matchEntitiesInSegment(html.slice(i, segEnd));
      i = segEnd;
    }
    return result;
  }

  function matchEntitiesInSegment(text) {
    var spans = [];
    for (var ei = 0; ei < _entities.length; ei++) {
      var entity = _entities[ei];
      for (var ti = 0; ti < entity.terms.length; ti++) {
        var term = entity.terms[ti];
        var escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var pattern = new RegExp(escaped, 'gi');
        var m;
        while ((m = pattern.exec(text)) !== null) {
          var s = m.index;
          var e = s + m[0].length;
          // Word boundary: char before/after must not be a word character
          var before = s > 0 ? text[s - 1] : ' ';
          var after  = e < text.length ? text[e] : ' ';
          if (/\w/.test(before) || /\w/.test(after)) continue;
          // Reject if overlaps an already-claimed span
          var overlaps = false;
          for (var si = 0; si < spans.length; si++) {
            if (!(e <= spans[si].s || s >= spans[si].e)) { overlaps = true; break; }
          }
          if (!overlaps)
            spans.push({ s: s, e: e, id: entity.id, type: entity.type, matched: m[0] });
        }
      }
    }
    if (spans.length === 0) return text;
    spans.sort(function(a, b) { return a.s - b.s; });
    var out = '';
    var pos = 0;
    for (var si = 0; si < spans.length; si++) {
      var sp = spans[si];
      out += text.slice(pos, sp.s);
      out += '<span class="entity entity-' + sp.type + '" data-id="' + sp.id
           + '" data-type="' + sp.type + '">' + sp.matched + '</span>';
      pos = sp.e;
    }
    return out + text.slice(pos);
  }

  // ── Cursor save / restore ────────────────────────────────────────────────────
  // Block elements (div, p, br, li) each contribute +1 to the offset so that
  // "cursor at end of line N" and "cursor at start of empty line N+1" always
  // produce distinct offsets and survive an innerHTML replacement.

  var _BLOCK = /^(BR|DIV|P|LI|H1|H2|H3|H4|H5|H6|UL|OL|BLOCKQUOTE)$/;
  function _isBlock(node) { return node.nodeType === 1 && _BLOCK.test(node.nodeName); }

  function getCaretOffset(el) {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return 0;
    var range   = sel.getRangeAt(0);
    var endNode = range.endContainer;
    var endOff  = range.endOffset;
    var count   = 0;
    var found   = false;

    // Count all text + block entries in a subtree (no early-exit needed).
    function countSubtree(node) {
      if (node.nodeType === 3) { count += node.length; return; }
      if (node !== el && _isBlock(node)) count++;
      for (var i = 0; i < node.childNodes.length; i++) countSubtree(node.childNodes[i]);
    }

    function walk(node) {
      if (found) return;
      // Block elements (except root) add 1 to the running offset.
      if (node !== el && _isBlock(node)) count++;
      // Have we arrived at the cursor's container?
      if (node === endNode) {
        if (node.nodeType === 3) {
          count += endOff;
        } else {
          // Element node: count block children that come before endOff.
          for (var k = 0; k < endOff && k < node.childNodes.length; k++) {
            countSubtree(node.childNodes[k]);
          }
        }
        found = true;
        return;
      }
      if (node.nodeType === 3) { count += node.length; return; }
      for (var i = 0; i < node.childNodes.length; i++) {
        walk(node.childNodes[i]);
        if (found) return;
      }
    }

    walk(el);
    return count;
  }

  function setCaretOffset(el, offset) {
    var range = document.createRange();
    var sel   = window.getSelection();
    var count = 0;
    var found = false;

    function place(node, off) {
      try { range.setStart(node, off); range.collapse(true); found = true; } catch(e) {}
    }

    function walk(node) {
      if (found) return;
      if (node !== el && _isBlock(node)) {
        count++;
        // If the offset lands exactly at the start of this block, place cursor here.
        if (count === offset) { place(node, 0); return; }
      }
      if (node.nodeType === 3) {
        var len = node.length;
        if (count + len >= offset) { place(node, offset - count); }
        else { count += len; }
        return;
      }
      for (var i = 0; i < node.childNodes.length; i++) {
        walk(node.childNodes[i]);
        if (found) return;
      }
    }

    walk(el);
    if (!found) {
      // Fallback: move to end of editor content.
      try { range.setStart(el, el.childNodes.length); range.collapse(true); found = true; } catch(e) {}
    }
    if (found && sel) { sel.removeAllRanges(); sel.addRange(range); }
  }

  // ── Re-highlight in place (preserves cursor position) ───────────────────────

  function refreshHighlighting() {
    var editor = document.getElementById('editor');
    var pos = getCaretOffset(editor);
    var raw = stripAllVisualSpans(editor.innerHTML);
    var highlighted = applyCommentHighlighting(raw);
    highlighted = applyEntityHighlighting(highlighted);
    editor.innerHTML = highlighted;
    setCaretOffset(editor, pos);
    // innerHTML replacement detaches the old ranges — rebuild them on the new nodes
    renderAnnotations();
  }

  // ── Formatting commands ──────────────────────────────────────────────────────

  function execFormat(command) {
    document.execCommand(command, false, null);
    document.getElementById('editor').focus();
    scheduleNotify();
  }

  // ── Change notification ──────────────────────────────────────────────────────
  // Notification and highlighting run on separate timers so the DOM is not
  // modified before C# reads the content via getContent().
  //
  // IMPORTANT: the URL includes a unique timestamp so WebView2 treats each call
  // as a new navigation. Without this, WebView2 ignores repeated navigations to
  // the same URL and C# never receives subsequent saves.

  function scheduleNotify() {
    clearTimeout(_notifyTimer);
    clearTimeout(_highlightTimer);

    // Capture raw content immediately on every input so _rawContent is always
    // current.  This ensures getContent() returns the latest text even if C#
    // calls flushContent()+getContent() before the 800ms debounce fires.
    _rawContent = stripAllVisualSpans(document.getElementById('editor').innerHTML);
    _wordCount = computeWordCount(_rawContent);

    _notifyTimer = setTimeout(function() {
      // Notify C# — unique URL forces a fresh Navigating event every time
      window.location.href = 'alphawriter://contentChanged?t=' + Date.now();
      // Apply visual highlighting shortly after (non-blocking for C# retrieval)
      _highlightTimer = setTimeout(refreshHighlighting, 50);
    }, 800);
  }

  document.getElementById('editor').addEventListener('input', scheduleNotify);

  // Paste as plain text only
  document.getElementById('editor').addEventListener('paste', function(e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  // ── Editorial annotations ────────────────────────────────────────────────────
  // C# pushes { notes: [...], spans: [{ note, anchor, occ, offset, length, primary }] }.
  // Each span is located by its anchor sentence (the exact sentence text C# analyzed,
  // and which occurrence of it), then by the offset within that sentence — so the
  // underline lands on the exact words. Painted via CSS.highlights: no DOM changes.

  var _annData = null;          // last payload from C#
  var _annVisible = true;       // toolbar toggle
  var _annRanges = [];          // [{ note, range, primary }]
  var _popNote = null;          // note shown in the popover
  var _focusTimer = null;

  var _HL_SUPPORTED = typeof CSS !== 'undefined' && !!CSS.highlights && typeof Highlight !== 'undefined';
  var _HL_KEYS = ['aw-copy', 'aw-line', 'aw-dev'];

  function setAnnotations(data) {
    _annData = data || null;
    hidePopover();
    renderAnnotations();
    return _annRanges.length;
  }

  function setAnnotationsVisible(visible) {
    _annVisible = !!visible;
    if (!_annVisible) hidePopover();
    renderAnnotations();
  }

  function clearAnnotations() {
    _annData = null;
    _annRanges = [];
    hidePopover();
    if (_HL_SUPPORTED) _HL_KEYS.forEach(function(k) { CSS.highlights.delete(k); });
  }

  // Builds a whitespace-normalized view of the editor's text with a map back to
  // DOM positions. Mirrors the C# plain-text pipeline: comment spans are skipped,
  // whitespace runs collapse to one space, block elements become '\n'.
  function buildTextIndex(root) {
    var text = [];
    var map = [];               // per char: [node, offset], or null for virtual chars
    var lastSpace = true;

    function boundary() {
      if (text.length && text[text.length - 1] !== '\n') { text.push('\n'); map.push(null); }
      lastSpace = true;
    }

    function walk(node) {
      if (node.nodeType === 3) {
        var v = node.nodeValue;
        for (var i = 0; i < v.length; i++) {
          var c = v[i];
          if (c === ' ' || c === ' ' || c === '\t' || c === '\n' || c === '\r') {
            if (!lastSpace) { text.push(' '); map.push([node, i]); lastSpace = true; }
          } else {
            text.push(c); map.push([node, i]); lastSpace = false;
          }
        }
        return;
      }
      if (node.nodeType !== 1) return;
      if (node.classList && node.classList.contains('comment')) return;
      var block = node !== root && _isBlock(node);
      if (block) boundary();
      for (var k = 0; k < node.childNodes.length; k++) walk(node.childNodes[k]);
      if (block) boundary();
    }

    walk(root);
    return { text: text.join(''), map: map };
  }

  // Finds the occ-th standalone occurrence of a sentence: whitespace or a paragraph
  // edge on both sides, which is how C# delimits sentences.
  function findAnchor(index, anchor, occ) {
    if (!anchor) return -1;
    var text = index.text, from = 0, seen = 0, first = -1;
    while (true) {
      var at = text.indexOf(anchor, from);
      if (at === -1) break;
      var before = at > 0 ? text[at - 1] : ' ';
      var afterIdx = at + anchor.length;
      var after = afterIdx < text.length ? text[afterIdx] : ' ';
      if ((before === ' ' || before === '\n') && (after === ' ' || after === '\n')) {
        if (seen === occ) return at;
        if (first === -1) first = at;
        seen++;
      }
      from = at + 1;
    }
    return first;   // fewer copies than C# saw — best effort
  }

  function rangeFor(index, start, length) {
    if (start < 0 || length <= 0 || start + length > index.map.length) return null;
    var a = index.map[start], b = index.map[start + length - 1];
    if (!a || !b) return null;
    try {
      var r = document.createRange();
      r.setStart(a[0], a[1]);
      r.setEnd(b[0], b[1] + 1);
      return r;
    } catch (e) { return null; }
  }

  function spanRange(index, span) {
    var at = findAnchor(index, span.anchor, span.occ || 0);
    if (at < 0) return null;
    var offset = span.offset || 0;
    var len = Math.min(span.length || 0, span.anchor.length - offset);
    return rangeFor(index, at + offset, len);
  }

  function renderAnnotations() {
    _annRanges = [];
    if (!_HL_SUPPORTED) return;
    _HL_KEYS.forEach(function(k) { CSS.highlights.delete(k); });
    if (!_annVisible || !_annData || !_annData.spans || !_ready) return;

    var index = buildTextIndex(document.getElementById('editor'));
    var groups = { copy: [], line: [], dev: [] };

    _annData.spans.forEach(function(span) {
      var note = _annData.notes[span.note];
      if (!note || note._gone) return;
      var r = spanRange(index, span);
      if (!r) return;
      _annRanges.push({ note: note, range: r, primary: !!span.primary });
      (groups[note.category] || groups.dev).push(r);
    });

    if (groups.copy.length) CSS.highlights.set('aw-copy', new Highlight(...groups.copy));
    if (groups.line.length) CSS.highlights.set('aw-line', new Highlight(...groups.line));
    if (groups.dev.length)  CSS.highlights.set('aw-dev',  new Highlight(...groups.dev));
  }

  // Annotation under a DOM point — the smallest range wins when they overlap.
  function annotationAt(node, offset) {
    var best = null, bestLen = Infinity;
    for (var i = 0; i < _annRanges.length; i++) {
      var a = _annRanges[i];
      try {
        if (!a.range.isPointInRange(node, offset)) continue;
      } catch (e) { continue; }
      var len = a.range.toString().length;
      if (len < bestLen) { best = a; bestLen = len; }
    }
    return best;
  }

  function primaryRange(note) {
    for (var i = 0; i < _annRanges.length; i++)
      if (_annRanges[i].note === note && _annRanges[i].primary) return _annRanges[i].range;
    return null;
  }

  // ── Popover ──────────────────────────────────────────────────────────────────

  var _CAT_COLORS = { copy: '#61AFEF', line: '#E5C07B', dev: '#C678DD' };

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function showPopover(ann) {
    var pop = document.getElementById('aw-pop');
    var note = ann.note;
    _popNote = note;

    var html = '<div class="aw-head"><span class="aw-dot" style="background:' + (_CAT_COLORS[note.category] || '#888') + '"></span>'
             + '<span class="aw-title">' + escapeHtml(note.title) + '</span></div>'
             + '<div class="aw-msg">' + escapeHtml(note.message) + '</div>';

    if (note.suggestions && note.suggestions.length) {
      html += '<div class="aw-sugg">';
      note.suggestions.slice(0, 4).forEach(function(s, i) {
        html += '<button data-sugg="' + i + '" title="Replace with this">' + escapeHtml(s) + '</button>';
      });
      html += '</div>';
    }

    if (note.fixAction) {
      html += '<div class="aw-sugg"><button data-act="fix" title="Apply this fix">'
            + escapeHtml(note.fixActionLabel || 'Fix') + '</button></div>';
    }

    html += '<div class="aw-actions">'
          + '<button data-act="dismiss" title="Hide this note">Ignore</button>'
          + '<button data-act="disable-scene" title="Stop flagging this rule in the current scene">Off in scene</button>'
          + '<button data-act="disable-rule" title="Turn this rule off for the whole book">Turn rule off</button>';
    if (note.canAllowWord && note.evidence)
      html += '<button data-act="allow-word" title="Never flag this word in this book">Allow “' + escapeHtml(note.evidence) + '”</button>';
    html += '</div>';

    pop.innerHTML = html;
    pop.classList.add('open');

    // Position under the clicked words, flipping above when near the bottom
    var rect = ann.range.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.max(8, Math.min(rect.left, window.innerWidth - pw - 8));
    var top = rect.bottom + 6;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, rect.top - ph - 6);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function hidePopover() {
    _popNote = null;
    var pop = document.getElementById('aw-pop');
    if (pop) pop.classList.remove('open');
  }

  function retireNote(note) {
    note._gone = true;
    hidePopover();
    renderAnnotations();
  }

  // Keep the editor's selection while clicking popover buttons
  document.getElementById('aw-pop').addEventListener('mousedown', function(e) { e.preventDefault(); });

  document.getElementById('aw-pop').addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn || !_popNote) return;
    var note = _popNote;

    if (btn.hasAttribute('data-sugg')) {
      var replacement = note.suggestions[+btn.getAttribute('data-sugg')];
      var r = primaryRange(note);
      if (r && replacement != null) {
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        document.execCommand('insertText', false, replacement);   // fires input → save + re-analysis
      }
      retireNote(note);
      return;
    }

    var act = btn.getAttribute('data-act');
    if (!act) return;
    window.location.href = 'alphawriter://noteAction?action=' + encodeURIComponent(act)
      + '&fp=' + encodeURIComponent(note.fingerprint || '')
      + '&rule=' + encodeURIComponent(note.ruleId || '')
      + '&word=' + encodeURIComponent(act === 'allow-word' ? (note.evidence || '') : '')
      + '&value=' + encodeURIComponent(act === 'fix' ? (note.fixAction || '') : '')
      + '&t=' + Date.now();
    retireNote(note);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hidePopover();

    // App shortcuts. The WebView owns the keyboard while the author types, so the
    // window never sees these — forward them to C# (WriterPage.OnEditorNavigating).
    var k = null;
    if (e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey)
      k = /^[1-5]$/.test(e.key) ? e.key : (e.key === '\\' ? 'sidebar' : null);
    else if (e.key === 'F8' && !e.ctrlKey && !e.altKey && !e.metaKey)
      k = e.shiftKey ? 'prev' : 'next';   // step through editorial notes
    if (k) {
      e.preventDefault();
      window.location.href = 'alphawriter://shortcut?k=' + k + '&t=' + Date.now();
    }
  });
  document.getElementById('editor').addEventListener('scroll', hidePopover);
  document.getElementById('editor').addEventListener('input', hidePopover);

  // Clicking inside underlined words opens their popover
  document.getElementById('editor').addEventListener('click', function(e) {
    if (!_annVisible || _annRanges.length === 0) return;
    if (e.target.closest && e.target.closest('.entity')) return;
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !sel.isCollapsed) { hidePopover(); return; }
    var r = sel.getRangeAt(0);
    var ann = annotationAt(r.startContainer, r.startOffset);
    if (ann) showPopover(ann); else hidePopover();
  });

  // ── Focus (note card / report navigation) ────────────────────────────────────
  // target: { fingerprint, anchor, occ, offset, length }

  function focusAnnotation(target) {
    if (!target || !_ready) return false;
    var r = null;

    if (target.fingerprint) {
      for (var i = 0; i < _annRanges.length && !r; i++)
        if (_annRanges[i].primary && _annRanges[i].note.fingerprint === target.fingerprint)
          r = _annRanges[i].range;
    }
    if (!r && target.anchor) {
      var index = buildTextIndex(document.getElementById('editor'));
      r = spanRange(index, { anchor: target.anchor, occ: target.occ || 0,
                             offset: target.offset || 0, length: target.length || target.anchor.length });
    }
    if (!r) return false;

    try {
      var node = r.startContainer.nodeType === 3 ? r.startContainer.parentElement : r.startContainer;
      if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch (e) {}

    if (_HL_SUPPORTED) {
      CSS.highlights.set('aw-focus', new Highlight(r));
      clearTimeout(_focusTimer);
      _focusTimer = setTimeout(function() { CSS.highlights.delete('aw-focus'); }, 2200);
    }

    // Leave the caret at the start of the flagged words
    try {
      var caret = r.cloneRange();
      caret.collapse(true);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(caret);
      document.getElementById('editor').focus({ preventScroll: true });
    } catch (e) {}
    return true;
  }

  // Entity click → notify C# with entity id and type
  document.getElementById('editor').addEventListener('click', function(e) {
    var t = e.target;
    while (t && t !== this) {
      if (t.classList && t.classList.contains('entity')) {
        e.preventDefault();
        var id   = t.getAttribute('data-id');
        var type = t.getAttribute('data-type');
        if (id && type) {
          window.location.href = 'alphawriter://entityClicked?id='
            + encodeURIComponent(id) + '&type=' + encodeURIComponent(type);
        }
        return;
      }
      t = t.parentElement;
    }
  });
</script>
</body>
</html>
